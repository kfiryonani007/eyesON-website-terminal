<!DOCTYPE html>
<html dir="rtl" lang="he">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="robots" content="noindex, nofollow">
  <title>הגדרות אתר | EYESON</title>
  <link rel="icon" type="image/svg+xml" href="../assets/favicon.svg">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Assistant:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="admin.css">
</head>
<body>

  <!-- shown until the server confirms a session -->
  <div class="gate" id="gate">
    <div class="gate-card">
      <img src="../assets/favicon.svg" alt="" width="40" height="40">
      <h1>הגדרות אתר EYESON</h1>
      <p class="gate-msg" id="gateMsg">בודק הרשאה…</p>
      <form class="gate-form" id="gateForm" hidden>
        <label for="gatePass">סיסמת מנהל</label>
        <div class="pass-wrap">
          <input type="password" id="gatePass" autocomplete="current-password" required>
          <button type="button" class="pass-toggle" id="passToggle" aria-label="הצגת הסיסמה" aria-pressed="false"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M1.6 12S5.5 5 12 5s10.4 7 10.4 7-3.9 7-10.4 7S1.6 12 1.6 12Z"/><circle cx="12" cy="12" r="3.2"/></svg></button>
        </div>
        <button type="submit" class="btn-primary">כניסה</button>
        <p class="gate-error" id="gateError" role="alert"></p>
      </form>
    </div>
  </div>

  <div class="app" id="app" hidden>
    <header class="topbar">
      <div>
        <h1>הגדרות אתר</h1>
        <p class="topbar-sub">כל שינוי כאן עולה לאתר לכל מי שנכנס, ברגע שלוחצים "שמירה".</p>
      </div>
      <div class="topbar-actions">
        <span class="dirty-flag" id="dirtyFlag" hidden>יש שינויים שלא נשמרו</span>
        <a class="btn-ghost" href="../index.html" target="_blank" rel="noopener">תצוגת האתר</a>
        <button class="btn-primary" id="saveBtn" disabled>שמירה</button>
      </div>
    </header>

    <div class="layout">
      <nav class="sidebar" id="sidebar" aria-label="סקשנים"></nav>
      <main class="panel" id="panel" tabindex="-1"></main>
    </div>
  </div>

  <div class="toast" id="toast" role="status" aria-live="polite" hidden></div>

  <script src="admin.js"></script>
</body>
</html>
